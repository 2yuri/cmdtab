name: Release

# Push a tag like v1.0.1 to build, sign (Developer ID), notarize and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      TEAM_ID: RQTYDUV329
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # Secrets (Settings → Secrets and variables → Actions):
      #   DEVELOPER_ID_P12_BASE64   base64 of the exported "Developer ID Application" certificate (.p12)
      #   DEVELOPER_ID_P12_PASSWORD password chosen when exporting the .p12
      #   NOTARY_KEY_P8_BASE64      base64 of the App Store Connect API key (.p8)
      #   NOTARY_KEY_ID             its Key ID
      #   NOTARY_ISSUER_ID          the Issuer ID shown above the keys list
      - name: Import signing certificate into a temporary keychain
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"

      - name: Set the version from the tag
        run: |
          SHORT="${VERSION#v}"
          sed -i '' "s/CFBundleShortVersionString: \".*\"/CFBundleShortVersionString: \"$SHORT\"/" project.yml
          sed -i '' "s/CFBundleVersion: \".*\"/CFBundleVersion: \"$GITHUB_RUN_NUMBER\"/" project.yml

      - name: Build and sign
        run: |
          xcodegen generate --quiet
          xcodebuild -project CmdTab.xcodeproj -scheme CmdTab -configuration Release \
            -archivePath build/CmdTab.xcarchive \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            archive -quiet
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/CmdTab.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export
          codesign --verify --deep --strict --verbose=2 build/export/CmdTab.app

      - name: Notarize and staple
        env:
          KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent build/export/CmdTab.app build/CmdTab-notarize.zip
          xcrun notarytool submit build/CmdTab-notarize.zip \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID" --wait
          xcrun stapler staple build/export/CmdTab.app
          spctl --assess --type execute --verbose=2 build/export/CmdTab.app
          rm "$RUNNER_TEMP/notary.p8"

      - name: Package
        run: |
          ditto -c -k --keepParent build/export/CmdTab.app "build/CmdTab-$VERSION.zip"
          shasum -a 256 "build/CmdTab-$VERSION.zip" | tee "build/CmdTab-$VERSION.zip.sha256"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" "build/CmdTab-$VERSION.zip" "build/CmdTab-$VERSION.zip.sha256" \
            --title "cmdtab $VERSION" --generate-notes --verify-tag

      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
