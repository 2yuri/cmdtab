name: Release

# Push a tag like v1.0.1 to build, sign (Developer ID), notarize and publish a GitHub release.
# Run it by hand with an existing tag to rebuild and replace that release's files.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, like v1.0.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      TEAM_ID: RQTYDUV329
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Secrets (Settings → Secrets and variables → Actions):
      #   DEVELOPER_ID_P12_BASE64   base64 of the exported "Developer ID Application" certificate (.p12)
      #   DEVELOPER_ID_P12_PASSWORD password chosen when exporting the .p12
      #   NOTARY_KEY_P8_BASE64      base64 of the App Store Connect API key (.p8)
      #   NOTARY_KEY_ID             its Key ID
      #   NOTARY_ISSUER_ID          the Issuer ID shown above the keys list
      - name: Import signing certificate into a temporary keychain
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"

      - name: Set the version from the tag
        run: |
          SHORT="${VERSION#v}"
          sed -i '' "s/CFBundleShortVersionString: \".*\"/CFBundleShortVersionString: \"$SHORT\"/" project.yml
          sed -i '' "s/CFBundleVersion: \".*\"/CFBundleVersion: \"$GITHUB_RUN_NUMBER\"/" project.yml

      - name: Build and sign
        run: |
          xcodegen generate --quiet
          xcodebuild -project CmdTab.xcodeproj -scheme CmdTab -configuration Release \
            -archivePath build/CmdTab.xcarchive \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            archive -quiet
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/CmdTab.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export
          codesign --verify --deep --strict --verbose=2 build/export/CmdTab.app

      - name: Notarize and staple
        env:
          KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent build/export/CmdTab.app build/CmdTab-notarize.zip
          xcrun notarytool submit build/CmdTab-notarize.zip \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID" --wait
          xcrun stapler staple build/export/CmdTab.app
          spctl --assess --type execute --verbose=2 build/export/CmdTab.app
          rm "$RUNNER_TEMP/notary.p8"

      - name: Package
        run: |
          ditto -c -k --keepParent build/export/CmdTab.app "build/CmdTab-$VERSION.zip"
          scripts/make-dmg.sh build/export/CmdTab.app "build/CmdTab-$VERSION.dmg"

      - name: Sign, notarize and staple the DMG
        env:
          KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          DMG="build/CmdTab-$VERSION.dmg"
          codesign --sign "Developer ID Application" --timestamp "$DMG"
          echo "$KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID" --wait
          rm "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          (cd build && shasum -a 256 "CmdTab-$VERSION.dmg" "CmdTab-$VERSION.zip" | tee SHA256SUMS)

      - name: Sign the update and write the appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          # The app reads releases/latest/download/appcast.xml, so every release carries its own feed.
          ZIP="build/CmdTab-$VERSION.zip"
          SIGNATURE=$(echo "$SPARKLE_ED_PRIVATE_KEY" | build/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - "$ZIP")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" build/export/CmdTab.app/Contents/Info.plist)
          SHORT=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" build/export/CmdTab.app/Contents/Info.plist)
          cat > build/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>CmdTab</title>
              <item>
                <title>CmdTab $SHORT</title>
                <pubDate>$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")</pubDate>
                <sparkle:version>$BUILD</sparkle:version>
                <sparkle:shortVersionString>$SHORT</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <sparkle:releaseNotesLink>https://github.com/${{ github.repository }}/releases/tag/$VERSION</sparkle:releaseNotesLink>
                <enclosure url="https://github.com/${{ github.repository }}/releases/download/$VERSION/CmdTab-$VERSION.zip" type="application/octet-stream" $SIGNATURE/>
              </item>
            </channel>
          </rss>
          EOF
          xmllint --noout build/appcast.xml
          cat build/appcast.xml

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # CmdTab.dmg never changes name, so releases/latest/download/CmdTab.dmg is always the newest one.
          cp "build/CmdTab-$VERSION.dmg" build/CmdTab.dmg
          FILES="build/CmdTab-$VERSION.dmg build/CmdTab.dmg build/CmdTab-$VERSION.zip build/SHA256SUMS build/appcast.xml"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" $FILES --clobber
          else
            gh release create "$VERSION" $FILES --title "cmdtab $VERSION" --generate-notes --verify-tag
          fi

      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
