name: CmdTab

options:
  bundleIdPrefix: dev.yuri
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.4

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: RQTYDUV329
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_OBJC_WEAK: YES

targets:
  CmdTab:
    type: application
    platform: macOS
    sources:
      - path: Sources/CmdTab
    dependencies:
      - package: Sparkle
      - target: NowPlayingBridge
        link: false
        embed: true
        codeSign: true
        copy:
          destination: frameworks
    # Hardened runtime: without this, macOS turns down Calendar access without asking.
    entitlements:
      path: Sources/CmdTab/CmdTab.entitlements
      properties:
        com.apple.security.personal-information.calendars: true
    info:
      path: Sources/CmdTab/Info.plist
      properties:
        CFBundleName: CmdTab
        CFBundleDisplayName: CmdTab
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 Yuri Miguel"
        # Auto update (Sparkle): one feed request a day, signed with an EdDSA key, no system profile.
        SUFeedURL: https://github.com/2yuri/cmdtab/releases/latest/download/appcast.xml
        SUPublicEDKey: "3zdeUkH940Q/EGmM6jLbjHei2Z5SNV+uNkyJZgy4LqA="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUEnableSystemProfiling: false
        # Island modules, each asked only when its module is turned on.
        NSCalendarsFullAccessUsageDescription: "The island shows your next meeting five minutes before it starts, with a Join button. Events stay on your Mac."
        NSBluetoothAlwaysUsageDescription: "The island shows a moment when your headphones connect, with their battery."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yuri.CmdTab
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Runs inside /usr/bin/perl to read Now Playing for the island (see NowPlayingBridge.m).
  NowPlayingBridge:
    type: library.dynamic
    platform: macOS
    sources:
      - path: Sources/NowPlayingBridge
    settings:
      base:
        PRODUCT_NAME: CmdTabNowPlaying
        EXECUTABLE_PREFIX: lib
        CLANG_ENABLE_OBJC_ARC: YES
        SKIP_INSTALL: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        OTHER_LDFLAGS: "-framework Foundation"

  CmdTabTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/CmdTabTests
    dependencies:
      - target: CmdTab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yuri.CmdTabTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CmdTab:
    build:
      targets:
        CmdTab: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CmdTabTests
    archive:
      config: Release
