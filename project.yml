name: CmdTab

options:
  bundleIdPrefix: dev.yuri
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: RQTYDUV329
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_OBJC_WEAK: YES

targets:
  CmdTab:
    type: application
    platform: macOS
    sources:
      - path: Sources/CmdTab
    info:
      path: Sources/CmdTab/Info.plist
      properties:
        CFBundleName: CmdTab
        CFBundleDisplayName: CmdTab
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 Yuri Miguel"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yuri.CmdTab
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  CmdTabTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/CmdTabTests
    dependencies:
      - target: CmdTab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yuri.CmdTabTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CmdTab:
    build:
      targets:
        CmdTab: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CmdTabTests
    archive:
      config: Release
